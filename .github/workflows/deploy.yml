# Auto-deploy: every push to main runs the tests, then deploys the website, security rules and the Med Control
# server function (ai). The paperwork email (notifyPaperwork) is left out until its SMTP secret exists.
# Needs the repo secret FIREBASE_SERVICE_ACCOUNT, and ANTHROPIC_API_KEY in Google Secret Manager (setup in docs/auto-deploy.md).
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test tools
        working-directory: tests
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser tests
        run: node tests/browser.test.mjs
      - name: Med Control privacy filter
        run: npm ci --prefix functions && node tests/medcontrol-privacy.test.cjs

  # Security-rule tests in the emulators. Informational for now (2 known storage failures); make it gate deploy once green.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - working-directory: tests
        run: npm ci
      - run: npx -y firebase-tools@15 emulators:exec --only firestore,storage --project pvrs-rules-test "node tests/rules.test.mjs"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Install function dependencies
        run: npm ci --prefix functions
      - name: Deploy website, rules and functions
        run: npx -y firebase-tools@15 deploy --only hosting,firestore:rules,storage,functions:ai --project pvrs-membership --non-interactive --force

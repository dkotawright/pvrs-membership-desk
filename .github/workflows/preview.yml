# Preview the website on a pull request. Hosting only, on a channel named pr-<number>.
# Never deploys rules, functions, or the live channel. Forks are skipped (no secret).
# Uses the same FIREBASE_SERVICE_ACCOUNT secret as .github/workflows/deploy.yml.
name: Hosting preview

on:
  pull_request:

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the website
        run: npm ci && npm run build
      - name: Deploy Hosting preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: pvrs-membership
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d
          entryPoint: .
          firebaseToolsVersion: "15"
